<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архитектурное Портфолио</title>
    <style>
        :root {
            --bg-color: #111;
            --card-bg: #1a1a1a;
            --inner-bg: #222;
            --border-color: #333;
            --text-color: #eee;
            --text-muted: #aaa;
            --accent-hover: rgba(255, 255, 255, 0.2);
        }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 40px; }
        h1 { border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 0; }
        .project { background: var(--card-bg); padding: 20px; margin-bottom: 25px; border-radius: 8px; border: 1px solid var(--border-color); }
        .project h2 { margin-top: 0; font-size: 1.4rem; color: #fff; }
        .gallery { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 15px; }
        .img-card { background: var(--inner-bg); padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); width: 220px; }
        
        img.thumb { width: 100%; height: 140px; object-fit: cover; border-radius: 4px; display: block; cursor: pointer; transition: opacity 0.2s ease; }
        img.thumb:hover { opacity: 0.8; }
        
        .caption { font-size: 12px; margin-top: 8px; color: var(--text-muted); word-break: break-all; text-align: center; }

        /* Модальное окно (Lightbox) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
        }
        .modal-content-wrapper {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
            cursor: pointer;
        }
        .close-btn {
            position: absolute;
            top: -50px;
            right: 0;
            color: #fff;
            font-size: 28px;
            background: rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s ease;
            z-index: 1010;
        }
        .close-btn:hover { background: var(--accent-hover); }
        
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            font-size: 24px;
            padding: 15px 20px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s ease;
            z-index: 1010;
        }
        .nav-btn:hover { background: var(--accent-hover); }
        .prev-btn { left: -70px; }
        .next-btn { right: -70px; }
        
        .image-counter {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-muted);
            font-size: 14px;
            white-space: nowrap;
        }

        .empty-notice { color: var(--text-muted); font-style: italic; }

        /* Адаптивность для мобильных экранов */
        @media (max-width: 768px) {
            body { padding: 15px; }
            .prev-btn { left: 10px; }
            .next-btn { right: 10px; }
            .nav-btn { padding: 10px 15px; font-size: 18px; background: rgba(0,0,0,0.6); }
        }
    </style>
</head>
<body>
    <h1>Архитектурное портфолио</h1>

        <div class="project">
            <h2>Проект: Facade_Restoration</h2>
            <div class="gallery">

                <div class="img-card">
                    <img src="projects/Facade_Restoration/DJI_0126.JPG" alt="DJI_0126.JPG" class="thumb" onclick="openModal(0, 0)" loading="lazy">
                    <div class="caption" title="DJI_0126.JPG">DJI_0126.JPG</div>
                </div>

                <div class="img-card">
                    <img src="projects/Facade_Restoration/DJI_0127.JPG" alt="DJI_0127.JPG" class="thumb" onclick="openModal(0, 1)" loading="lazy">
                    <div class="caption" title="DJI_0127.JPG">DJI_0127.JPG</div>
                </div>

                <div class="img-card">
                    <img src="projects/Facade_Restoration/DJI_0128.JPG" alt="DJI_0128.JPG" class="thumb" onclick="openModal(0, 2)" loading="lazy">
                    <div class="caption" title="DJI_0128.JPG">DJI_0128.JPG</div>
                </div>

                <div class="img-card">
                    <img src="projects/Facade_Restoration/DJI_0129.JPG" alt="DJI_0129.JPG" class="thumb" onclick="openModal(0, 3)" loading="lazy">
                    <div class="caption" title="DJI_0129.JPG">DJI_0129.JPG</div>
                </div>

                <div class="img-card">
                    <img src="projects/Facade_Restoration/DJI_0130.JPG" alt="DJI_0130.JPG" class="thumb" onclick="openModal(0, 4)" loading="lazy">
                    <div class="caption" title="DJI_0130.JPG">DJI_0130.JPG</div>
                </div>

                <div class="img-card">
                    <img src="projects/Facade_Restoration/DJI_0131.JPG" alt="DJI_0131.JPG" class="thumb" onclick="openModal(0, 5)" loading="lazy">
                    <div class="caption" title="DJI_0131.JPG">DJI_0131.JPG</div>
                </div>

                <div class="img-card">
                    <img src="projects/Facade_Restoration/DJI_0132.JPG" alt="DJI_0132.JPG" class="thumb" onclick="openModal(0, 6)" loading="lazy">
                    <div class="caption" title="DJI_0132.JPG">DJI_0132.JPG</div>
                </div>

                <div class="img-card">
                    <img src="projects/Facade_Restoration/DJI_0133.JPG" alt="DJI_0133.JPG" class="thumb" onclick="openModal(0, 7)" loading="lazy">
                    <div class="caption" title="DJI_0133.JPG">DJI_0133.JPG</div>
                </div>

                <div class="img-card">
                    <img src="projects/Facade_Restoration/DJI_0134.JPG" alt="DJI_0134.JPG" class="thumb" onclick="openModal(0, 8)" loading="lazy">
                    <div class="caption" title="DJI_0134.JPG">DJI_0134.JPG</div>
                </div>

                <div class="img-card">
                    <img src="projects/Facade_Restoration/DJI_0135.JPG" alt="DJI_0135.JPG" class="thumb" onclick="openModal(0, 9)" loading="lazy">
                    <div class="caption" title="DJI_0135.JPG">DJI_0135.JPG</div>
                </div>

                <div class="img-card">
                    <img src="projects/Facade_Restoration/DJI_0136.JPG" alt="DJI_0136.JPG" class="thumb" onclick="openModal(0, 10)" loading="lazy">
                    <div class="caption" title="DJI_0136.JPG">DJI_0136.JPG</div>
                </div>

                <div class="img-card">
                    <img src="projects/Facade_Restoration/DJI_0137.JPG" alt="DJI_0137.JPG" class="thumb" onclick="openModal(0, 11)" loading="lazy">
                    <div class="caption" title="DJI_0137.JPG">DJI_0137.JPG</div>
                </div>

                <div class="img-card">
                    <img src="projects/Facade_Restoration/DJI_0138.JPG" alt="DJI_0138.JPG" class="thumb" onclick="openModal(0, 12)" loading="lazy">
                    <div class="caption" title="DJI_0138.JPG">DJI_0138.JPG</div>
                </div>

                <div class="img-card">
                    <img src="projects/Facade_Restoration/DJI_0139.JPG" alt="DJI_0139.JPG" class="thumb" onclick="openModal(0, 13)" loading="lazy">
                    <div class="caption" title="DJI_0139.JPG">DJI_0139.JPG</div>
                </div>

                <div class="img-card">
                    <img src="projects/Facade_Restoration/DJI_0140.JPG" alt="DJI_0140.JPG" class="thumb" onclick="openModal(0, 14)" loading="lazy">
                    <div class="caption" title="DJI_0140.JPG">DJI_0140.JPG</div>
                </div>

            </div>
        </div>

    <!-- Модальное окно для просмотрщика -->
    <div id="lightbox" class="modal" role="dialog" aria-modal="true" onclick="handleModalClick(event)">
        <div class="modal-content-wrapper">
            <div class="close-btn" onclick="closeModal()" title="Закрыть (Esc)">&times;</div>
            <button class="nav-btn prev-btn" onclick="changeImage(-1); event.stopPropagation();" title="Предыдущая (←)">&#10094;</button>
            <img id="lightbox-img" onclick="changeImage(1); event.stopPropagation();" title="Следующая (клик)" alt="Увеличенное изображение">
            <button class="nav-btn next-btn" onclick="changeImage(1); event.stopPropagation();" title="Следующая (→)">&#10095;</button>
            <div id="image-counter" class="image-counter"></div>
        </div>
    </div>

    <script>
        // Данные проектов переданы безопасно из Python
        const projectsData = [{"name": "Facade_Restoration", "images": ["DJI_0126.JPG", "DJI_0127.JPG", "DJI_0128.JPG", "DJI_0129.JPG", "DJI_0130.JPG", "DJI_0131.JPG", "DJI_0132.JPG", "DJI_0133.JPG", "DJI_0134.JPG", "DJI_0135.JPG", "DJI_0136.JPG", "DJI_0137.JPG", "DJI_0138.JPG", "DJI_0139.JPG", "DJI_0140.JPG"]}];

        let currentProjectIndex = 0;
        let currentImageIndex = 0;

        function openModal(projectIdx, imageIdx) {
            if (!projectsData[projectIdx] || !projectsData[projectIdx].images[imageIdx]) return;
            
            currentProjectIndex = projectIdx;
            currentImageIndex = imageIdx;
            
            const modal = document.getElementById('lightbox');
            modal.style.display = 'flex';
            updateModalImage();
            
            // Блокируем скролл основной страницы
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('lightbox');
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function changeImage(direction) {
            if (!projectsData[currentProjectIndex]) return;
            const images = projectsData[currentProjectIndex].images;
            
            currentImageIndex += direction;

            // Зацикливание галереи
            if (currentImageIndex < 0) {
                currentImageIndex = images.length - 1;
            } else if (currentImageIndex >= images.length) {
                currentImageIndex = 0;
            }

            updateModalImage();
        }

        function updateModalImage() {
            const proj = projectsData[currentProjectIndex];
            if (!proj) return;
            
            const imageName = proj.images[currentImageIndex];
            const imagePath = `projects/${encodeURIComponent(proj.name)}/${encodeURIComponent(imageName)}`;
            
            const modalImg = document.getElementById('lightbox-img');
            modalImg.src = imagePath;
            modalImg.alt = imageName;

            // Обновляем счетчик
            const counter = document.getElementById('image-counter');
            counter.innerText = `${currentImageIndex + 1} / ${proj.images.length} — Проект: ${proj.name}`;
        }

        // Закрытие по клику на темный фон
        function handleModalClick(event) {
            if (event.target.id === 'lightbox') {
                closeModal();
            }
        }

        // Управление с клавиатуры
        document.addEventListener('keydown', function(event) {
            const modal = document.getElementById('lightbox');
            if (modal && modal.style.display === 'flex') {
                if (event.key === 'Escape') {
                    closeModal();
                } else if (event.key === 'ArrowLeft') {
                    changeImage(-1);
                } else if (event.key === 'ArrowRight') {
                    changeImage(1);
                }
            }
        });
    </script>
</body>
</html>
